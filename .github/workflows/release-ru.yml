name: Release RU

# Русская сборка форка: push тега `ru-v1.2.3` → NSIS-установщик → GitHub release.
# Без BetterInstaller и без подписи автора (BMM_PRIVATE_KEY есть только у оригинала).

on:
  push:
    tags: ['ru-v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install deps
        run: npm ci

      - name: Build the MCP sidecar
        working-directory: src-tauri
        shell: pwsh
        run: |
          cargo build --release --example bmm-mcp-server
          if ($LASTEXITCODE -ne 0) { throw "sidecar build failed" }
          Copy-Item target/release/examples/bmm-mcp-server.exe binaries/bmm-mcp-server-x86_64-pc-windows-msvc.exe -Force

      - name: Build app + NSIS installer
        shell: pwsh
        run: |
          npx tsc --project frontend
          if ($LASTEXITCODE -ne 0) { throw "tsc failed" }
          npx tauri build --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw "tauri build failed" }

      - name: Collect assets
        id: assets
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force out | Out-Null
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter *-setup.exe | Select-Object -First 1
          Copy-Item $setup.FullName "out/BetterModsManager_RU_${v}_x64-setup.exe"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create $env:TAG (Get-ChildItem out).FullName --title "Better Mods Manager $env:TAG (русская версия)" --notes-file RELEASE_RU.md --latest
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: bmm-ru
          path: out/
